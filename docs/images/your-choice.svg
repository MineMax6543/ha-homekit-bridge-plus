<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="One Home Assistant entity, a garden pump switch, can become a sprinkler, an outlet, a light bulb or a motion sensor in Apple Home. For a light you also choose which features are exposed, for example brightness and color temperature but not color.">
  <style>
    :root {
      --bg: #ffffff; --card: #f4f5f7; --line: #d0d5dd; --text: #1d2939; --muted: #667085; --arrow: #98a2b3;
      --on: #12b76a; --off: #98a2b3;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --card: #161b22; --line: #30363d; --text: #e6edf3; --muted: #8b949e; --arrow: #6e7681;
        --on: #3fb950; --off: #6e7681; }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .pick { fill: var(--card); stroke: url(#brand); stroke-width: 3; }
    .t { fill: var(--text); font: 600 17px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .s { fill: var(--muted); font: 400 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .m { fill: var(--muted); font: 400 13.5px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .w { fill: #ffffff; font: 700 17px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .a { stroke: var(--arrow); stroke-width: 2.5; fill: none; marker-end: url(#head); }
    .al { fill: var(--muted); font: 600 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ok { fill: var(--on); font: 700 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .no { fill: var(--off); font: 400 14px system-ui, -apple-system, "Segoe UI", sans-serif; text-decoration: line-through; }
  </style>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#f4511e"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#98a2b3"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="360" rx="16"/>

  <!-- Row 1: type -->
  <text class="al" x="24" y="34">ACCESSORY TYPE</text>
  <rect class="card" x="24" y="54" width="220" height="72" rx="12"/>
  <text class="t" x="42" y="84">Garden pump</text>
  <text class="m" x="42" y="106">switch.garden_pump</text>

  <path class="a" d="M246 90 H296"/>
  <rect x="302" y="64" width="150" height="52" rx="12" fill="url(#brand)"/>
  <text class="w" x="320" y="96">your choice</text>

  <path class="a" d="M454 80 C480 80 480 50 506 50"/>
  <path class="a" d="M454 100 C480 100 480 130 506 130"/>
  <rect class="pick" x="512" y="24" width="200" height="52" rx="12"/>
  <text class="t" x="530" y="56">Sprinkler</text>
  <rect class="card" x="728" y="24" width="208" height="52" rx="12"/>
  <text class="t" x="746" y="56">Outlet</text>
  <rect class="card" x="512" y="104" width="200" height="52" rx="12"/>
  <text class="t" x="530" y="136">Light bulb</text>
  <rect class="card" x="728" y="104" width="208" height="52" rx="12"/>
  <text class="t" x="746" y="136">Motion sensor</text>

  <!-- Row 2: features -->
  <text class="al" x="24" y="214">EXPOSED FEATURES</text>
  <rect class="card" x="24" y="234" width="220" height="72" rx="12"/>
  <text class="t" x="42" y="264">Ceiling light</text>
  <text class="m" x="42" y="286">light.ceiling</text>

  <path class="a" d="M246 270 H296"/>
  <rect x="302" y="244" width="150" height="52" rx="12" fill="url(#brand)"/>
  <text class="w" x="320" y="276">your choice</text>
  <path class="a" d="M454 270 H506"/>

  <rect class="pick" x="512" y="230" width="424" height="80" rx="12"/>
  <text class="t" x="530" y="260">Light bulb in Apple Home</text>
  <text class="ok" x="530" y="290">✓ on/off</text>
  <text class="ok" x="616" y="290">✓ brightness</text>
  <text class="ok" x="728" y="290">✓ color temp</text>
  <text class="no" x="846" y="290">color</text>

  <text class="s" x="24" y="344">Same for fans (speed, oscillation), blinds (position, tilt), thermostats (modes), TVs (inputs) …</text>
</svg>
